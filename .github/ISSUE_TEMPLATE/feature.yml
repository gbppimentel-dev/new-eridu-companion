name: enhancement
description: suggest a companion improvement.
title: "[enhancement] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: what would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: suggested behavior
      description: include the game context and how you would use it on the second screen.
    validations:
      required: true
